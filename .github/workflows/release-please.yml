name: Release

on:
  workflow_dispatch:
    inputs:
      version_bump:
        description: 'Version bump type (major, minor, patch)'
        required: true
        default: 'patch'
        type: choice
        options:
          - patch
          - minor
          - major
  push:
    branches:
      - master
    paths:
      - "pkg/common/version.go"

permissions:
  contents: write
  packages: write
  id-token: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Configure Git
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

      - name: Auto-bump version
        if: github.event_name == 'push'
        id: autobump
        run: |
          # Read current version
          current_version=$(grep -oP 'var VERSION = "\K[^"]+' pkg/common/version.go)
          echo "Current version: $current_version"
          
          # Parse version components
          IFS='.' read -r major minor patch <<< "$current_version"
          
          # Bump patch version
          patch=$((patch + 1))
          new_version="${major}.${minor}.${patch}"
          
          echo "New version: $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          
          # Update version.go
          sed -i "s/var SUMMARY = \"v${current_version}\"/var SUMMARY = \"v${new_version}\"/" pkg/common/version.go
          sed -i "s/var VERSION = \"${current_version}\"/var VERSION = \"${new_version}\"/" pkg/common/version.go
          
          # Commit and push
          git add pkg/common/version.go
          git commit -m "chore(release): ${new_version}"
          git push origin master
          
      - name: Manual version bump
        if: github.event_name == 'workflow_dispatch'
        id: manual
        run: |
          current_version=$(grep -oP 'var VERSION = "\K[^"]+' pkg/common/version.go)
          echo "Current version: $current_version"
          
          IFS='.' read -r major minor patch <<< "$current_version"
          
          case "${{ github.event.inputs.version_bump }}" in
            major)
              major=$((major + 1))
              minor=0
              patch=0
              ;;
            minor)
              minor=$((minor + 1))
              patch=0
              ;;
            patch)
              patch=$((patch + 1))
              ;;
          esac
          
          new_version="${major}.${minor}.${patch}"
          echo "New version: $new_version"
          echo "version=$new_version" >> "$GITHUB_OUTPUT"
          echo "tag=v${new_version}" >> "$GITHUB_OUTPUT"
          
          # Update version.go
          sed -i "s/var SUMMARY = \"v${current_version}\"/var SUMMARY = \"v${new_version}\"/" pkg/common/version.go
          sed -i "s/var VERSION = \"${current_version}\"/var VERSION = \"${new_version}\"/" pkg/common/version.go
          
          # Also update web/package.json
          if [ -f web/package.json ]; then
            sed -i "s/\"version\": \"${current_version}\"/\"version\": \"${new_version}\"/" web/package.json
            git add web/package.json
          fi
          
          # Update release manifest
          if [ -f .release-please-manifest.json ]; then
            echo "{\".\":\"${new_version}\"}" > .release-please-manifest.json
            git add .release-please-manifest.json
          fi
          
          # Commit and push
          git add pkg/common/version.go
          git commit -m "chore(release): ${new_version}"
          git push origin master

      - name: Check tag does not exist
        id: check
        run: |
          if git rev-parse "${{ steps.autobump.outputs.tag || steps.manual.outputs.tag }}" >/dev/null 2>&1; then
            echo "Tag already exists, skipping release."
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Go
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        if: steps.check.outputs.exists == 'false'
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Create and push tag
        if: steps.check.outputs.exists == 'false'
        env:
          TAG: ${{ steps.autobump.outputs.tag || steps.manual.outputs.tag }}
        run: |
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Run GoReleaser
        if: steps.check.outputs.exists == 'false'
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.autobump.outputs.tag || steps.manual.outputs.tag }}
