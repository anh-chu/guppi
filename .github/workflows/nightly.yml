name: Nightly

on:
  workflow_dispatch:
  schedule:
    # 02:00 UTC every day
    - cron: "0 2 * * *"

permissions:
  contents: read

concurrency:
  group: nightly
  cancel-in-progress: false

jobs:
  nightly:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Compute nightly tag
        id: tag
        run: |
          # Snapshots use a SemVer tag shape for versioning; the date + sha live in the prerelease segment.
          ts=$(date -u +'%Y%m%d%H%M%S')
          sha=$(git rev-parse --short=8 HEAD)
          tag="v0.0.0-nightly.${ts}.${sha}"
          echo "tag=${tag}" >> "$GITHUB_OUTPUT"

      - name: Run GoReleaser snapshot
        uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --snapshot --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GORELEASER_CURRENT_TAG: ${{ steps.tag.outputs.tag }}

      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: termyard-nightly-${{ steps.tag.outputs.tag }}
          path: dist/
          retention-days: 7
          if-no-files-found: error
